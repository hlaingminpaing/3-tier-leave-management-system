image: node:22-alpine

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - security
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: $CI_REGISTRY
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  VERSION_TAG: ${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

test_backend:
  stage: test
  script:
    - cd backend
    - npm ci
    - npm test -- --coverage
  artifacts:
    paths:
      - backend/coverage/

test_frontend:
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm test -- --coverage
  artifacts:
    paths:
      - frontend/coverage/

sast:
  stage: security
secret_detection:
  stage: security
dependency_scanning:
  stage: security

build_and_push:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  needs: ["test_backend", "test_frontend"]
  before_script:
    - if [ -n "$CI_COMMIT_TAG" ]; then export VERSION_TAG=$CI_COMMIT_TAG; else export VERSION_TAG=$CI_COMMIT_SHORT_SHA; fi
    - echo "Using version tag $VERSION_TAG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
  script:
    # Backend Build
    - echo "Building Backend version $VERSION_TAG..."
    - docker build -t $IMAGE_PREFIX/backend:$VERSION_TAG -t $IMAGE_PREFIX/backend:latest ./backend
    - docker push $IMAGE_PREFIX/backend:$VERSION_TAG
    - docker push $IMAGE_PREFIX/backend:latest

    # Frontend Build
    - echo "Building Frontend version $VERSION_TAG..."
    - docker build -t $IMAGE_PREFIX/frontend:$VERSION_TAG -t $IMAGE_PREFIX/frontend:latest ./frontend
    - docker push $IMAGE_PREFIX/frontend:$VERSION_TAG
    - docker push $IMAGE_PREFIX/frontend:latest

update_manifests:
  stage: deploy
  image: bitnami/git:latest
  needs: ["build_and_push"]
  script:
    - if [ -n "$CI_COMMIT_TAG" ]; then export VERSION_TAG=$CI_COMMIT_TAG; else export VERSION_TAG=$CI_COMMIT_SHORT_SHA; fi
    
    - git remote set-url origin "https://${CI_DEPLOY_USER}:${GIT_DEPLOY_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "CI Bot"
    
    - git fetch origin $CI_DEFAULT_BRANCH
    - git checkout $CI_DEFAULT_BRANCH

    - "sed -i \"s|image: $IMAGE_PREFIX/backend:.*|image: $IMAGE_PREFIX/backend:$VERSION_TAG|g\" k8s/backend.yaml"
    - "sed -i \"s|image: $IMAGE_PREFIX/frontend:.*|image: $IMAGE_PREFIX/frontend:$VERSION_TAG|g\" k8s/frontend.yaml"

    - |
      if git diff --quiet; then
        echo "No changes in manifests. Skipping push."
      else
        git add k8s/*.yaml
        git commit -m "chore: update images to $VERSION_TAG [skip ci]"
        git push origin $CI_DEFAULT_BRANCH
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

