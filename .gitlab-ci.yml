image: node:22-alpine

stages:
  - test
  - security
  - build
  - validate

variables:
  REGISTRY: $CI_REGISTRY
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  DOCKER_BUILDKIT: 1

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/
    - frontend/node_modules/

test_backend:
  stage: test
  script:
    - cd backend
    - npm ci
    - npm test -- --coverage
  cache:
    key: ${CI_COMMIT_REF_SLUG}-backend
    paths:
      - backend/node_modules/

test_frontend:
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm test -- --coverage
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules/

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

sast:
  stage: security

secret_detection:
  stage: security

dependency_scanning:
  stage: security

build_and_push:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - export DOCKER_BUILDKIT=1

    - echo "Building Backend..."
    - cd backend
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 -t $REGISTRY/$IMAGE_PREFIX/backend:sha-$CI_COMMIT_SHORT_SHA -t $REGISTRY/$IMAGE_PREFIX/backend:latest .
    - docker push $REGISTRY/$IMAGE_PREFIX/backend:sha-$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/$IMAGE_PREFIX/backend:latest
    - cd ..

    - echo "Building Frontend..."
    - cd frontend
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 -t $REGISTRY/$IMAGE_PREFIX/frontend:sha-$CI_COMMIT_SHORT_SHA -t $REGISTRY/$IMAGE_PREFIX/frontend:latest .
    - docker push $REGISTRY/$IMAGE_PREFIX/frontend:sha-$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/$IMAGE_PREFIX/frontend:latest
    - cd ..
  only:
    - main
    - master

lint_k8s:
  stage: validate
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/ --dry-run=client
  only:
    - main
    - master

lint_helm:
  stage: validate
  image: bitnami/helm:latest
  script:
    - helm lint helm-chart/
    - helm template test-release helm-chart/
  only:
    - main
    - master
