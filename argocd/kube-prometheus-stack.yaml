apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 1. Helm Chart from Prometheus Community
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 91.4.1
      helm:
        valueFiles:
          - $values/monitoring/prometheus/value.yaml
    # 2. Values file from your Git repository
    - repoURL: 'https://gitlab.com/hlaingminpaing/3-tier-leave-management-system.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply is REQUIRED for kube-prometheus-stack CRDs (> 256KB)
      - ServerSideApply=true
