apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: leave-management-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/hlaingminpaing/3-tier-leave-management-system.git'
    targetRevision: HEAD
    path: helm-chart
    helm:
      releaseName: leave-management-system
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true 
    syncOptions:
      - CreateNamespace=true
