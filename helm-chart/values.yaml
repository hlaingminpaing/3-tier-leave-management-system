# Default values for leave-management-system Helm chart
# This is a YAML-formatted file for GitOps deployment

# Global configuration
global:
  namespace: default
  environment: production

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: registry.gitlab.com/hlaingminpaing/3-tier-leave-management-system/frontend
    tag: v1.0.2
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  
  env:
    API_URL: "/api"
  
  podAnnotations: {}
  # annotations:
  #   prometheus.io/scrape: "true"

# Backend configuration
backend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: registry.gitlab.com/hlaingminpaing/3-tier-leave-management-system/backend
    tag: v1.0.2
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    metricsPort: 9464
  
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4318"
    LOG_LEVEL: "info"
  
  # Database non-sensitive config (host/name/port are NOT secrets — safe in values.yaml)
  # These are used only in inline mode. In existingSecret/sealedSecrets mode,
  # db-host and db-name come from the Secret itself.
  database:
    # In inline mode: host = the MySQL service name (StatefulSet headless service)
    # Default: <release-name>-leave-management-system-mysql (set to actual service name)
    host: "leave-management-system-mysql"
    name: leave_db
    port: 3306
  
  # ─────────────────────────────────────────────────────────────────────────
  # Secrets Management — choose ONE mode, leave others at defaults
  # ─────────────────────────────────────────────────────────────────────────
  secrets:

    # ── Mode A: Existing Secret (RECOMMENDED — zero secrets in values.yaml) ──
    # Point to a Secret that already exists in the cluster.
    # Helm renders NO Secret resource — it just references this name.
    # Create the Secret externally via SealedSecret (kubeseal) or manually:
    #   kubectl apply -f sealed-secret.yaml
    # When set, all other modes below are ignored.
    existingSecret: ""

    # ── Mode B: Inline (Development / local only) ──
    # Helm creates a plain Secret from the values below.
    # WARNING: passwords are stored in plain text in Helm state. Dev only!
    externalSecrets: false
    externalSecretsName: "leave-secrets-external"
    inline:
      dbUser: "root"
      dbPassword: "root"
      jwtSecret: "super-secure-jwt-secret-key"
      rootPassword: "root"

    # ── Mode C: Helm-managed SealedSecret (GitOps, encrypted in values) ──
    # Helm renders a SealedSecret resource using kubeseal-encrypted values.
    # Set sealedSecrets: true and paste your kubeseal encryptedData below.
    # Install controller first: helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
    sealedSecrets: false
    sealedSecretsData: {}
    # sealedSecretsData:
    #   db-user: AgB...      # kubeseal encrypted
    #   db-password: AgB...  # kubeseal encrypted
    #   jwt-secret: AgB...   # kubeseal encrypted
    #   root-password: AgB.. # kubeseal encrypted
    #   db-host: AgB...      # kubeseal encrypted
    #   db-name: AgB...      # kubeseal encrypted
  
  podAnnotations: {}
  # Example for Prometheus monitoring:
  # annotations:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "9464"
  #   prometheus.io/path: "/metrics"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 70

# MySQL configuration
mysql:
  enabled: true
  
  image:
    repository: mysql
    tag: "8"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3306
    headless: true
  
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""  # Use default storage class
    # Force access mode for persistence
    accessMode: ReadWriteOnce
  
  podAnnotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # IMPORTANT: Set your ACM certificate ARN
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
  
  host: "leave.example.com"
  paths:
    - path: /api
      pathType: Prefix
      backend: backend
    - path: /
      pathType: Prefix
      backend: frontend

# Network policies
networkPolicies:
  enabled: false

# Gateway API configuration (alternative to Ingress)
gatewayApi:
  enabled: false
  tls:
    certificateSecretName: "leave-system-cert"
  
# HPA for backend
autoscaling:
  enabled: true

# Service Monitor for Prometheus (optional)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s

# Service Account
serviceAccount:
  create: true
  name: leave-system-sa

# Override fullname
nameOverride: ""
fullnameOverride: ""
