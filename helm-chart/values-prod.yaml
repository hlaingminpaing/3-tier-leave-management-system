# Production environment values override
# Usage: helm install -f values.yaml -f values-prod.yaml
# IMPORTANT: Store sensitive credentials in AWS Secrets Manager or similar
# and use ExternalSecrets addon

global:
  namespace: production
  environment: production

frontend:
  replicaCount: 3
  image:
    tag: sha-e2ac005
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

backend:
  replicaCount: 3
  image:
    tag: sha-e2ac005
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  secrets:
    externalSecrets: true
    externalSecretsName: leave-secrets-production
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

mysql:
  persistence:
    size: 50Gi
    storageClassName: "gp3"  # AWS EBS GP3

ingress:
  enabled: true
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:region:account-id:certificate/prod-cert-id"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:region:account-id:global/webacl/name/id"
  host: "leave.example.com"

# Service Account
serviceAccount:
  create: true
  name: leave-system-prod-sa
