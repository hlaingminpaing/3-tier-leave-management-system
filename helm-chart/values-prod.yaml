# Production environment values override
# Usage: helm install -f values.yaml -f values-prod.yaml
# IMPORTANT: Store sensitive credentials in AWS Secrets Manager or similar
# and use ExternalSecrets addon

global:
  namespace: production
  environment: production

frontend:
  replicaCount: 3
  image:
    tag: sha-e2ac005
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

backend:
  replicaCount: 3
  image:
    tag: sha-e2ac005
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  secrets:
    # ── Mode C: Helm-managed SealedSecret (GitOps flow) ──
    # Flow:
    #   1. kubeseal encrypts plain-secret.yaml  →  encrypted values
    #   2. Paste encrypted values into sealedSecretsData below
    #   3. git push  →  ArgoCD syncs  →  Helm renders SealedSecret resource
    #   4. sealed-secrets-controller (kube-system) decrypts  →  creates plain Secret
    #   5. Backend pod reads DB credentials from Secret via secretKeyRef  ✅
    #
    # Prerequisite: sealed-secrets controller must be installed in kube-system:
    #   helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
    #
    # To encrypt your secrets (run once locally):
    #   kubeseal --controller-namespace kube-system --format yaml \
    #     < plain-secret.yaml > /dev/null
    #   (copy the encryptedData values from the output into sealedSecretsData below)
    #
    # See helm-chart/SEALED_SECRETS_SETUP.md for the full guide.
    existingSecret: ""
    externalSecrets: false
    sealedSecrets: true
    sealedSecretsData:
      # Replace each value with your kubeseal-encrypted output
      # Run: kubeseal --controller-namespace kube-system --format yaml < plain-secret.yaml
      db-user: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
      db-password: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
      jwt-secret: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
      root-password: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
      db-host: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
      db-name: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

mysql:
  persistence:
    size: 50Gi
    storageClassName: "gp3"  # AWS EBS GP3

ingress:
  enabled: true
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:region:account-id:certificate/prod-cert-id"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:region:account-id:global/webacl/name/id"
  host: "leave.example.com"

# Service Account
serviceAccount:
  create: true
  name: leave-system-prod-sa
