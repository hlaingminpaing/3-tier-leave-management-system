{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "leave-management-system.fullname" . }}-backend
  labels:
    {{- include "leave-management-system.labels" . | nindent 4 }}
    component: backend
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.backend.service.metricsPort }}
      targetPort: metrics-otel
      protocol: TCP
      name: metrics-otel
  selector:
    {{- include "leave-management-system.selectorLabels" . | nindent 4 }}
    component: backend
---
# Alias service named 'backend' so frontend nginx (proxy_pass http://backend:3000) resolves in kube-dns
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "leave-management-system.labels" . | nindent 4 }}
    component: backend
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.backend.service.metricsPort }}
      targetPort: metrics-otel
      protocol: TCP
      name: metrics-otel
  selector:
    {{- include "leave-management-system.selectorLabels" . | nindent 4 }}
    component: backend
{{- end }}
