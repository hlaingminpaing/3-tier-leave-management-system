{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leave-management-system.fullname" . }}-backend
  labels:
    {{- include "leave-management-system.labels" . | nindent 4 }}
    component: backend
  namespace: {{ .Values.global.namespace }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "leave-management-system.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "leave-management-system.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      serviceAccountName: {{ include "leave-management-system.serviceAccountName" . }}
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics-otel
          containerPort: 9464
          protocol: TCP
        {{- with .Values.backend.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        env:
        # ── DB credentials injected from Secret (never hardcoded in values.yaml) ──
        # Secret name resolves from: existingSecret → externalSecretsName → chart-managed
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: {{ include "leave-management-system.secretName" . }}
              key: db-host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "leave-management-system.secretName" . }}
              key: db-user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "leave-management-system.secretName" . }}
              key: db-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: {{ include "leave-management-system.secretName" . }}
              key: db-name
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "leave-management-system.secretName" . }}
              key: jwt-secret
        # ── Non-sensitive config from values.yaml ──
        {{- range $key, $value := .Values.backend.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
{{- end }}
