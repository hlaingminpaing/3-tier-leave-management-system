{{/*
  secrets.yaml — Controls how the DB Secret is provided to the backend.

  Three modes (set ONE in values.yaml):

  Mode 1 — existingSecret (RECOMMENDED for GitOps):
    backend.secrets.existingSecret: "my-pre-created-secret"
    → Helm renders NOTHING here. You manage the Secret externally.
    → Apply a SealedSecret with: kubectl apply -f sealed-secret.yaml
    → The sealed-secrets controller (in kube-system) decrypts it automatically.
    → No secret values ever touch values.yaml or Helm state.

  Mode 2 — sealedSecrets (Helm-managed SealedSecret):
    backend.secrets.sealedSecrets: true
    → Helm renders a SealedSecret resource using encryptedData from values.
    → Encrypted values are safe to commit to Git.

  Mode 3 — inline (Development only):
    backend.secrets.externalSecrets: false
    backend.secrets.sealedSecrets: false
    backend.secrets.existingSecret: ""
    → Helm renders a plain Secret from values.backend.secrets.inline.*
    → WARNING: plain-text passwords in values.yaml — dev only!
*/}}

{{- if and .Values.backend.enabled .Values.backend.secrets.existingSecret }}
# existingSecret mode — no Secret resource created by Helm.
# The deployment references: {{ .Values.backend.secrets.existingSecret }}
# Create this Secret externally, e.g.:
#   kubectl apply -f sealed-secret.yaml   (using kubeseal)
#   or: kubectl create secret generic {{ .Values.backend.secrets.existingSecret }} \
#         --from-literal=db-user=xxx --from-literal=db-password=xxx \
#         --from-literal=jwt-secret=xxx --from-literal=root-password=xxx \
#         --from-literal=db-host=xxx --from-literal=db-name=xxx \
#         -n {{ .Values.global.namespace }}
{{- end }}

{{- if and .Values.backend.enabled .Values.backend.secrets.sealedSecrets (not .Values.backend.secrets.existingSecret) }}
---
# SealedSecret — encrypted values from values.sealedSecretsData
# Install controller: helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
# Encrypt secrets:    kubeseal --controller-namespace kube-system --format yaml < plain.yaml
# Full guide:         helm-chart/SEALED_SECRETS_SETUP.md
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "leave-management-system.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "leave-management-system.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- if and .Values.backend.secrets.sealedSecretsData (ne (len .Values.backend.secrets.sealedSecretsData) 0) }}
    {{- toYaml .Values.backend.secrets.sealedSecretsData | nindent 4 }}
    {{- else }}
    _placeholder: "REPLACE_WITH_KUBESEAL_ENCRYPTED_VALUE"
    {{- end }}
  template:
    metadata:
      name: {{ include "leave-management-system.fullname" . }}-secrets
      namespace: {{ .Values.global.namespace }}
    type: Opaque
{{- end }}

{{- if and .Values.backend.enabled (not .Values.backend.secrets.existingSecret) (not .Values.backend.secrets.externalSecrets) (not .Values.backend.secrets.sealedSecrets) }}
---
# Inline Secret — development only, values sourced from values.backend.secrets.inline
# WARNING: plain-text passwords in Helm state. Never use in production.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leave-management-system.fullname" . }}-secrets
  labels:
    {{- include "leave-management-system.labels" . | nindent 4 }}
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  root-password: {{ .Values.backend.secrets.inline.rootPassword | quote }}
  db-user:       {{ .Values.backend.secrets.inline.dbUser | quote }}
  db-password:   {{ .Values.backend.secrets.inline.dbPassword | quote }}
  jwt-secret:    {{ .Values.backend.secrets.inline.jwtSecret | quote }}
  db-host:       {{ .Values.backend.database.host | quote }}
  db-name:       {{ .Values.backend.database.name | quote }}
{{- end }}
