# Development environment values override
# Usage: helm install -f values.yaml -f values-dev.yaml

global:
  namespace: default
  environment: development

frontend:
  replicaCount: 1
  image:
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

backend:
  replicaCount: 1
  image:
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  secrets:
    inline:
      dbUser: "dev"
      dbPassword: "devpassword"
      jwtSecret: "dev-jwt-secret"
      rootPassword: "devroot"
  autoscaling:
    enabled: false

mysql:
  persistence:
    size: 1Gi

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-southeast-1:268145348964:certificate/abefd3e5-fe3e-4230-a100-8bdcfffff719"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /health

# Service Account
serviceAccount:
  create: true
  name: leave-system-sa
